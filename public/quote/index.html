<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your quote</title>
<style>
  :root { --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff; --accent:#0ea5e9; --ok:#059669; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f1f5f9; --mute:#94a3b8; --line:#334155; --bg:#0b1220; --card:#111c2f; --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 14px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:14px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:0 0 10px; }
  .biz { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .mute { color:var(--mute); font-size:14px; }
  .big { font-size:30px; font-weight:700; letter-spacing:-.01em; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th { text-align:left; font-size:12px; color:var(--mute); font-weight:600; padding:6px 0; border-bottom:1px solid var(--line); }
  td { padding:9px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  th.r, td.r { text-align:right; white-space:nowrap; padding-left:10px; }
  tr.head td { font-weight:700; background:rgba(100,116,139,.08); padding-left:6px; }
  .tot td { border:0; padding:4px 0; } .tot .strong td { font-weight:700; font-size:17px; padding-top:8px; }
  .banner { border-radius:10px; padding:12px 14px; font-size:15px; margin-top:14px; border:1px solid; }
  .banner.ok { background:rgba(5,150,105,.1); border-color:var(--ok); color:var(--ok); }
  .banner.warn { background:rgba(180,83,9,.1); border-color:var(--warn); color:var(--warn); }
  .banner.bad { background:rgba(185,28,28,.08); border-color:var(--bad); color:var(--bad); }
  label.opt { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  label.opt:last-child { border-bottom:0; } label.opt span.p { margin-left:auto; font-weight:600; white-space:nowrap; }
  input[type=text], textarea { width:100%; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:9px; padding:10px; margin:6px 0 12px; }
  button { font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04263a; font-weight:700; width:100%; padding:13px; font-size:16px; }
  button:disabled { opacity:.5; cursor:default; }
  details { margin-top:12px; } summary { cursor:pointer; color:var(--mute); font-size:14px; }
  .terms { white-space:pre-wrap; font-size:13px; color:var(--mute); margin-top:8px; }
  .center { text-align:center; padding:40px 10px; } .err { color:var(--bad); font-size:14px; min-height:20px; }
  .note { font-size:13px; color:var(--mute); margin-top:12px; } .noprint {}
  @media print { body { background:#fff; color:#000; } .card { border:0; padding:0; } .noprint { display:none !important; } :root { --ink:#000; --mute:#555; --line:#ccc; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center mute">Loading your quote…</div></div>
<script>
(function () {
  var API = 'https://plcuidyfhyonsqeofkdy.supabase.co/functions/v1/quote';
  var app = document.getElementById('app');
  var money = function (n) { return new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' }).format(Number(n) || 0); };
  var dmy = function (iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function token() { var h = (location.hash || '').replace(/^#/, ''); var q = new URLSearchParams(location.search).get('t'); return (h || q || '').trim(); }
  function post(t, body) {
    body.t = t;
    return fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).then(function (r) { return r.json().then(function (j) { j.__status = r.status; return j; }); });
  }
  function fail(msg) { app.textContent = ''; app.appendChild(el('div', { class: 'card center' }, [el('h1', { text: 'This link isn’t working' }), el('p', { class: 'mute', text: msg })])); }
  function render(data, t) {
    var s = data.snapshot || {}; var b = s.business || {}; var q = s.quote || {};
    var lines = q.lines || []; var rate = Number(q.taxRate) || 0; var mode = q.hideDetail || 'none';
    var optional = lines.filter(function (l) { return l.optional && !l.heading; });
    var responded = data.response; var expired = q.validUntil && Date.now() > Date.parse(q.validUntil) + 86400000;
    var chosen = {}; (data.chosen_ids || []).forEach(function (id) { chosen[id] = true; });
    document.title = (q.number ? q.number + ' · ' : '') + (b.name || 'Quote');
    app.textContent = '';
    app.appendChild(el('div', { class: 'card' }, [el('div', { class: 'biz' }, [
      el('div', {}, [el('h1', { text: b.name || '' }), el('div', { class: 'mute', text: [b.licence, b.abn ? 'ABN ' + b.abn : ''].filter(Boolean).join(' · ') }), el('div', { class: 'mute', text: [b.phone, b.email, b.website].filter(Boolean).join(' · ') })]),
      el('div', { style: 'text-align:right' }, [el('div', { class: 'mute', text: 'QUOTE' }), el('div', { style: 'font-weight:700', text: q.number || '' })]),
    ])]));
    if (responded === 'accepted') app.appendChild(el('div', { class: 'banner ok', text: 'Accepted' + (data.responder_name ? ' by ' + data.responder_name : '') + (data.responded_at ? ' on ' + dmy(data.responded_at) : '') + '. Thank you, we’ll be in touch to book you in.' }));
    else if (responded === 'declined') app.appendChild(el('div', { class: 'banner bad', text: 'You declined this quote. If that was a mistake, please contact us.' }));
    else if (expired) app.appendChild(el('div', { class: 'banner warn', text: 'This quote expired on ' + dmy(q.validUntil) + '. Please contact us and we’ll update it.' }));
    var totalEl = el('div', { class: 'big', text: '' });
    var gstEl = el('td', { class: 'r', text: '' }); var totEl2 = el('td', { class: 'r', text: '' }); var exEl = el('td', { class: 'r', text: '' });
    function recalc() {
      var extra = 0; optional.forEach(function (l) { if (chosen[l.id]) extra += Number(l.total) || 0; });
      var total = (Number(q.total) || 0) + extra; var gst = rate ? total * rate / (100 + rate) : 0;
      totalEl.textContent = money(total); exEl.textContent = money(total - gst); gstEl.textContent = money(gst); totEl2.textContent = money(total);
    }
    app.appendChild(el('div', { class: 'card' }, [el('h2', { text: 'Total (GST inclusive)' }), totalEl, el('div', { class: 'mute', text: [q.title, s.client && s.client.name ? 'For ' + s.client.name : '', q.validUntil && !responded ? 'Valid until ' + dmy(q.validUntil) : ''].filter(Boolean).join(' · ') })]));
    var showPrices = mode === 'none';
    var rows = [];
    if (mode === 'lines') rows.push(el('tr', {}, [el('td', { text: q.title || 'As described' }), el('td', { class: 'r', text: money(q.total) })]));
    else lines.forEach(function (l) {
      if (l.heading) { rows.push(el('tr', { class: 'head' }, [el('td', { colspan: showPrices ? '3' : '1', text: l.description || '' })])); return; }
      if (l.optional) return;
      rows.push(el('tr', {}, [el('td', { text: l.description || '' })].concat(showPrices ? [el('td', { class: 'r', text: String(l.qty) }), el('td', { class: 'r', text: money(l.total) })] : [])));
    });
    var head = mode === 'lines' ? ['Description', 'Total'] : (showPrices ? ['Description', 'Qty', 'Total'] : ['Description']);
    var table = el('table', {}, [el('thead', {}, [el('tr', {}, head.map(function (h, i) { return el('th', { class: i ? 'r' : '', text: h }); }))]), el('tbody', {}, rows)]);
    var totals = el('table', { class: 'tot' }, [el('tbody', {}, [
      el('tr', {}, [el('td', { class: 'mute', text: 'Subtotal (ex GST)' }), exEl]),
      el('tr', {}, [el('td', { class: 'mute', text: 'GST' }), gstEl]),
      el('tr', { class: 'strong' }, [el('td', { text: 'Total (GST inclusive)' }), totEl2]),
    ])]);
    app.appendChild(el('div', { class: 'card' }, [el('h2', { text: 'Quote' }), el('div', { class: 'mute', style: 'margin-bottom:8px', text: q.date ? 'Issued ' + dmy(q.date) : '' }), table, totals, q.notes ? el('p', { class: 'note', text: q.notes }) : null]));
    var form = null; var err = el('div', { class: 'err', role: 'alert' });
    if (optional.length) {
      var optBox = el('div', { class: 'card' }, [el('h2', { text: responded ? 'Optional extras' : 'Optional extras (tick any you want)' })]);
      optional.forEach(function (l) {
        var cb = el('input', { type: 'checkbox' }); cb.checked = !!chosen[l.id]; cb.disabled = !!responded || expired;
        cb.addEventListener('change', function () { chosen[l.id] = cb.checked; recalc(); });
        optBox.appendChild(el('label', { class: 'opt' }, [cb, el('span', { text: l.description || '' }), el('span', { class: 'p', text: '+ ' + money(l.total) })]));
      });
      app.appendChild(optBox);
    }
    if (!responded && !expired) {
      var name = el('input', { type: 'text', placeholder: 'Your full name', 'aria-label': 'Your full name', maxlength: '80', autocomplete: 'name' });
      var note = el('textarea', { rows: '2', placeholder: 'Anything we should know? (optional)', maxlength: '300', 'aria-label': 'Note' });
      var agree = el('input', { type: 'checkbox', id: 'agree' });
      var accept = el('button', { class: 'primary', type: 'button', text: 'Accept this quote' });
      var decline = el('button', { type: 'button', style: 'width:100%;margin-top:10px', text: 'Decline' });
      function send(action) {
        err.textContent = '';
        if (action === 'accept') { if ((name.value || '').trim().length < 2) { err.textContent = 'Please type your full name.'; return; } if (!agree.checked) { err.textContent = 'Please tick the box to accept.'; return; } }
        accept.disabled = true; decline.disabled = true;
        var ids = optional.filter(function (l) { return chosen[l.id]; }).map(function (l) { return l.id; });
        post(t, { action: action, name: name.value, note: note.value, chosen: ids }).then(function (r) {
          if (r && (r.response || r.error === 'already_responded')) render(r, t);
          else { accept.disabled = false; decline.disabled = false; err.textContent = r && r.error === 'expired' ? 'This quote has expired. Please contact us.' : 'Something went wrong. Please try again.'; }
        }).catch(function () { accept.disabled = false; decline.disabled = false; err.textContent = 'No connection. Please try again.'; });
      }
      accept.addEventListener('click', function () { send('accept'); }); decline.addEventListener('click', function () { send('decline'); });
      var terms = q.terms ? el('details', {}, [el('summary', { text: 'Read the terms and conditions' }), el('div', { class: 'terms', text: q.terms })]) : null;
      app.appendChild(el('div', { class: 'card noprint' }, [el('h2', { text: 'Accept' }), el('label', { for: 'agree', class: 'mute' }, [name.parentNode ? null : null]), name, note,
        el('label', { class: 'opt', style: 'border:0;padding:0 0 12px' }, [agree, el('span', { text: 'I accept this quote' + (q.terms ? ' and the terms and conditions' : '') + '.' })]), err, accept, decline, terms]));
    } else if (q.terms) {
      app.appendChild(el('details', { class: 'noprint' }, [el('summary', { text: 'Terms and conditions' }), el('div', { class: 'terms', text: q.terms })]));
    }
    var print = el('button', { class: 'noprint', type: 'button', style: 'margin-top:14px;width:100%', text: 'Print or save as PDF' });
    print.addEventListener('click', function () { window.print(); });
    app.appendChild(print);
    recalc();
    if (!data.__counted) post(t, { action: 'view' }).catch(function () {});
  }
  var t = token();
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(t)) { fail('Please use the link we sent you.'); return; }
  fetch(API + '?t=' + encodeURIComponent(t)).then(function (r) { return r.ok ? r.json() : r.json().then(function (j) { throw j; }); })
    .then(function (data) { render(data, t); })
    .catch(function () { fail('We couldn’t find that quote. Please contact us and we’ll sort it out.'); });
})();
</script>
</body>
</html>
